# test_cases.yaml
defaults:  # 定义默认值
  a: ["zero", "zero", "zero", "zero"]
  b: ["zero", "zero", "zero", "zero"]
  c: "zero"
  expected_c: "zero"  # 默认的预期结果

test_cases:  # 测例定义
  case_1:
    description: "Test case with default values for a, b, and c"
    override: {}  # 不覆盖默认值
    expected_c: "zero"  # 预期的结果

  case_2:
    description: "Test input A/B subnormal support"
    override:
      a: ["minsubnormal"]
      b: ["four"]
    expected_c: "math.ldexp(1.0,-22)"  # 预期的结果
    expect: True

  case_3:
    description: "Test input C subnormal support"
    override:
      c: "minsubnormal"
    expected_c: "minsubnormal"  # 预期的结果
    expect: True

  # case_4:
  #   description: "Test output D subnormal support 1)"
  #   override:
  #     a: ["math.ldexp(1.0,-24)", "one"]
  #     b: ["math.ldexp(1.0,-14)", "math.ldexp(1.0,-15)"]
  #   expected_c: "zero"  # 预期的结果
  #   expect: False

  case_5:
    description: "Test output D subnormal support"
    override:
      c: "minsubnormal"
    expected_c: "minsubnormal"  # 预期的结果
    expect: True

  case_6:
    description: "Test Accuracy of the dot products"
    override:
      a: ["aboveone"]
      b: ["aboveone"]
    expected_c: "1 + math.ldexp(1, -9) + math.ldexp(1, -20)"  # 预期的结果
    expect: True

  case_7:
    description: "Test Products accumulated in FP32 which involves rounding."
    override:
      a: ["half", "half", "half", "half"]
      b: ["minsubnormal", "minsubnormal", "minsubnormal", "minsubnormal"]
      c: "one"
    expected_c: "one"
    expect: True

  case_8:
    description: "Test Sum starts from largest element 1)"
    override:
      a: ["one", "half", "half", "half"]
      b: ["one", "minsubnormal", "minsubnormal", "minsubnormal"]
    expected_c: "one"
    expect: True

  case_9:
    description: "Test Sum starts from largest element 2)"
    override:
      a: ["half", "one", "half", "half"]
      b: ["minsubnormal", "one", "minsubnormal", "minsubnormal"]
    expected_c: "one"
    expect: True

  case_10:
    description: "Test Rounding-to-Zero or Round-Down"
    override:
      a: ["one", "one"]
      b: ["two", "math.ldexp(1, -23)+math.ldexp(1, -24)"]
    expected_c: "two"
    expect: True

  case_11:
    description: "Test Rounding-to-Zero or Round-UP"
    override:
      a: ["one", "one"]
      b: ["minustwo", "-math.ldexp(1, -23) - math.ldexp(1, -24)"]
    expected_c: "minustwo"
    expect: True


  case_13:
    description: "Normalization in addition"
    override:
      a: ['one', 'one', 'one', 'one']
      b: ['minsubnormal', 'minsubnormal', 'minsubnormal', 'minsubnormal']
      c: "1.0 - math.ldexp(1.0, -24)"
    expected_c: "1.0 + math.ldexp(1.0, -23)"
    expect: True

  case_14:
    description: "Normalization in subtraction"
    override:
      a: ['one', 'one']
      b: ['one', '-math.ldexp(1.0, -24)']
      c: "-1.0 + math.ldexp(1.0, -24)"
    expected_c: "zero" 

  case_15:
    description: "Test extra bits for carry out"
    override:
      a: ['one', 'one', 'one', 'one', 'one', 'one', 'one', 'one']
      b: ['math.ldexp(1.0, -23)', 'one', 'one', 'one', 'one', 'one', 'one', 'one']
      c: "1.0 + math.ldexp(1.0, -21) + math.ldexp(1.0, -22) + math.ldexp(1.0, -23)"
    expected_c: "8.0 + math.ldexp(1.0, -20)"
    expect: True

  case_16:
    description: "Test QNaN + positive normalized number"
    override:
      a: ['one', 'one']
      b: ['qnan', 'one']
    expected_c: "(np.nan)"

  case_17:
    description: "Test QNaN + negative normalized number"
    override:
      a: ['one', 'one']
      b: ['qnan', 'minusone']
    expected_c: "(np.nan)"

  case_18:
    description: "QNaN + INF"
    override:
      a: ["one", "one"]
      b: ["qnan", "inf"]
    expected_c: "(np.nan)"

  case_19:
    description: "QNaN + QNaN"
    override:
      a: ["one", "one"]
      b: ["qnan", "qnan"]
    expected_c: "(np.nan)"

  case_20:
    description: "QNaN x normalized number"
    override:
      a: ["qnan"]
      b: ["two"]
    expected_c: "(np.nan)"

  case_21:
    description: "QNaN x 0"
    override:
      a: ["qnan"]
      b: ["zero"]
    expected_c: "(np.nan)"

  case_22:
    description: "QNaN x INF"
    override:
      a: ["qnan"]
      b: ["inf"]
    expected_c: "(np.nan)"

  case_23:
    description: "QNaN x QNaN"
    override:
      a: ["qnan"]
      b: ["qnan"]
    expected_c: "(np.nan)"

  case_24:
    description: "QNaN x SNaN"
    override:
      a: ["qnan"]
      b: ["snan"]
    expected_c: "(np.nan)"

  case_25:
    description: "SNaN x normalized number"
    override:
      a: ["snan"]
      b: ["two"]
    expected_c: "(np.nan)"

  case_26:
    description: "SNaN x 0"
    override:
      a: ["snan"]
      b: ["zero"]
    expected_c: "(np.nan)"

  case_27:
    description: "SNaN x INF"
    override:
      a: ["snan"]
      b: ["inf"]
    expected_c: "(np.nan)"

  case_28:
    description: "SNaN x QNaN"
    override:
      a: ["snan"]
      b: ["qnan"]
    expected_c: "(np.nan)"

  case_29:
    description: "SNaN x SNaN"
    override:
      a: ["snan"]
      b: ["snan"]
    expected_c: "(np.nan)"

  case_30:
    description: "SNaN + normalized number"
    override:
      a: ["one"]
      b: ["two"]
      c: "snan"
    expected_c: "(np.nan)"

  case_31:
    description: "0 x 0"
    override:
      a: ["zero"]
      b: ["zero"]
    expected_c: "zero"

  case_32:
    description: "0 x -0"
    override:
      a: ["zero"]
      b: ["(-0.0)"]
    expected_c: "zero"

  case_33:
    description: "-0 + 0"
    override:
     a: ["one", "one"]
     b: ["(-0.0)", "zero"]
    expected_c: "zero"

  case_34:
    description: "INF x 0"
    override:
      a: ["inf"]
      b: ["(0.0)"]
    expected_c: "(np.nan)"

  case_12:
    description: "Extra bits in the significand alignment"
    override:
      a: ["one"]
      b: ["one"]
      c: "-1.0 + math.ldexp(1, -24)"
    expected_c: "math.ldexp(1, -24)"
    expect: True

