# test_cases.yaml
defaults:  # 定义默认值
  a: ["zero", "zero", "zero", "zero"]
  b: ["zero", "zero", "zero", "zero"]
  c: "zero"
  expected_c: "zero"  # 默认的预期结果

test_cases:  # 测例定义
  case_1:
    description: "Test case with default values for a, b, and c"
    override: {}  # 不覆盖默认值
    expected_c: "zero"  # 预期的结果

  case_2:
    description: "Test input A/B subnormal support"
    override:
      a: ["minsubnormal"]
      b: ["four"]
    expected_c: "math.ldexp(1.0, -134)"  # 预期的结果
    expect: True

  case_2_1:
    description: "Test input A support 10 bit mantissa"
    override:
      a: ["1.0 + math.ldexp(1.0,-10)"]
      b: ["one"]
    expected_c: "1.0 + math.ldexp(1.0,-10)"  # 预期的结果
    expect: True

  case_2_2:
    description: "Test input A not support 11 bit mantissa"
    override:
      a: ["1.0 + math.ldexp(1.0,-11)"]
      b: ["one"]
    expected_c: "one"  # 预期的结果
    expect: 

  case_3:
    description: "Test input C subnormal support exact FP32 accuracy"
    override:
      c: "minsubnormal"
    expected_c: "minsubnormal"  # 预期的结果
    expect: True

  case_4:
    description: "Test output D subnormal support"
    override:
      c: "minsubnormal"
    expected_c: "minsubnormal"  # 预期的结果
    expect: True

  case_5:
    description: "Test Accuracy of the dot products"
    override:
      a: ["aboveone"]
      b: ["aboveone"]
    expected_c: "1 + math.ldexp(1, -9) + math.ldexp(1, -20)"  # 预期的结果
    expect: True


# —————————————————————— Varifying Rounding in Dot Cell ——————————————————————
  case_6:
    description: "Test two submatrix behavior -- different submatrix"
    override:
      a: ["math.ldexp(1.0, 127)", "zero", "zero", "zero", 
          "math.ldexp(1.0, 127)", "zero", "zero", "zero"]
      b: ["math.ldexp(1.0, 1)", "zero", "zero", "zero",
          "-math.ldexp(1.0, 0)", "zero", "zero", "zero"]
      c: "zero"
    expected_c: "math.ldexp(1.0, 127)"
    expect: False

  case_6_1: 
    description: "Test two submatrix behavior -- same submatrix"
    override:
      a: ["math.ldexp(1.0, 127)", "zero", "zero", "math.ldexp(1.0, 127)"]
      b: ["math.ldexp(1.0, 1)", "zero", "zero", "-math.ldexp(1.0, 0)"]
      c: "zero"
    expected_c: "math.ldexp(1.0, 127)"
    expect: True

# —————————————————————— ROUNDING ——————————————————————
  case_7:
    description: "Test Rounding-to-Zero or Round-Down"
    override:
      a: ["one", "one"]
      b: ["one", "math.ldexp(1, -24)+math.ldexp(1, -25)"]
    expected_c: "one"
    expect: True

  case_7_1:
    description: "Test Rounding-to-Zero or Round-UP"
    override:
      a: ["one", "one"]
      b: ["minusone", "-math.ldexp(1, -24) - math.ldexp(1, -25)"]
    expected_c: "minusone"
    expect: True

  case_8:
    description: "Test \"Accumulator\" Rounding-to-Zero or Round-UP"
    override:
      a: ["one"]
      b: ["minusone"]
      c: "-math.ldexp(1, -24) - math.ldexp(1, -25)"
    expected_c: "minusone"
    expect: True

  case_8_1:
    description: "Test \"Accumulator\" Rounding-to-Zero or Round-Down"
    override:
      a: ["one"]
      b: ["one"]
      c: "math.ldexp(1.0, -24) + math.ldexp(1.0, -25) "
    expected_c: "one"
    expect: True
  
  case_9:
    description: "One sticky bit in mantissa add: support 24bits"
    override:
      a: ["math.ldexp(1, -24)", "math.ldexp(1, -24)", "one"]
      b: ["one", "one", "one"]
      c: "zero"
    expected_c: "1.0 + math.ldexp(1, -23)"
    expect: True

  case_9_1:
    description: "One sticky bit in mantissa add: not support 25bits"
    override:
      a: ["math.ldexp(1, -24)", "math.ldexp(1, -24)", "math.ldexp(1, -24)", "one"]
      b: ["(0.5)", "(0.5)", "one", "one"]
      c: "zero"
    expected_c: "one"
    expect: True

  case_10:
    description: "Test extra bits for carry out, 4bits for BF16 K8"
    override:
      a: ["(1.75)", "(1.75)", "(1.75)", "math.ldexp(1.0, -20)"]
      b: ["(1.75)", "(1.75)", "(1.75)", "(1.0)"]     
      c: "zero"
    expected_c: "9 + 3*math.ldexp(1.0, -4) + math.ldexp(1.0, -20)"
    expect: True

  case_11:
    description: "Test exact bits in Accumulator: 1 extra bit pass"
    override:
      a: ["math.ldexp(1.0, -24)"]
      b: ["minusone"]
      c: "1.0+math.ldexp(1.0, -23)"
    expected_c: "one"
    expect: True
  
  case_11_1:
    description: "Test exact bits in Accumulator: 2 extra bit failed"
    override:
      a: ["math.ldexp(1.0, -25)"]
      b: ["minusone"]
      c: "1.0+math.ldexp(1.0, -23)"
    expected_c: "one"
    expect: True


  case_12:
    description: "Test accumulate rank in Accumulator: (k8_0 + C) +k8_1"
    override:
      a: ["math.ldexp(1.0, -24)", "zero", "zero", "zero", 
          "math.ldexp(1.0, -24)", "zero", "zero", "zero"]
      b: ["minusone", "zero", "zero", "zero",
          "one", "zero", "zero", "zero"]
      c: "1.0 + math.ldexp(1.0, -23)"
    expected_c: "one"
    expect: True    

  case_12_1:
    description: "Test accumulate rank in Accumulator: (k8_0 + C) +k8_1"
    override:
      a: ["math.ldexp(1.0, -24)", "zero", "zero", "zero",
          "math.ldexp(1.0, -24)", "zero", "zero", "zero"]
      b: ["one", "zero", "zero", "zero",
          "one", "zero", "zero", "zero"]
      c: "1.0 + math.ldexp(1.0, -23)"
    expected_c: "1.0+ math.ldexp(1.0, -23)"
    expect: True

  case_13:
    description: "Test the order of accumulation of dot products and C input: (C + dot_product_0) + dot_product_1"
    override:
      a: ["math.ldexp(1.0, 127)", "zero", "zero", "zero",
          "math.ldexp(1.0, 127)", "zero", "zero", "zero"]
      b: ["minusone", "zero", "zero", "zero",
          "one", "zero", "zero", "zero"]
      c: "math.ldexp(1.0, 127)"
    expected_c: "math.ldexp(1.0, 127)"
    expect: True
  
  case_14:
    description: "Test the order of accumulation of dot products and C input: (C + dot_product_0) + dot_product_1"
    override:
      a: ["math.ldexp(1.0, 127)", "zero", "zero", "zero",
          "math.ldexp(1.0, 127)", "zero", "zero", "zero"]
      b: ["one", "zero", "zero", "zero",
          "minusone", "zero", "zero", "zero"]
      c: "math.ldexp(1.0, 127)"
    expected_c: "inf"
    expect: True

  case_16:
    description: "Test QNaN + positive normalized number"
    override:
      a: ['one', 'one']
      b: ['qnan', 'one']
    expected_c: "(np.nan)"

  case_17:
    description: "Test QNaN + negative normalized number"
    override:
      a: ['one', 'one']
      b: ['qnan', 'minusone']
    expected_c: "(np.nan)"

  case_18:
    description: "QNaN + INF"
    override:
      a: ["one", "one"]
      b: ["qnan", "inf"]
    expected_c: "(np.nan)"

  case_19:
    description: "QNaN + QNaN"
    override:
      a: ["one", "one"]
      b: ["qnan", "qnan"]
    expected_c: "(np.nan)"

  case_20:
    description: "QNaN x normalized number"
    override:
      a: ["qnan"]
      b: ["two"]
    expected_c: "(np.nan)"

  case_21:
    description: "QNaN x 0"
    override:
      a: ["qnan"]
      b: ["zero"]
    expected_c: "(np.nan)"

  case_22:  
    description: "QNaN x INF"
    override:
      a: ["qnan"]
      b: ["inf"]
    expected_c: "(np.nan)"

  case_23:
    description: "QNaN x QNaN"
    override:
      a: ["qnan"]
      b: ["qnan"]
    expected_c: "(np.nan)"

  case_24:
    description: "QNaN x SNaN"
    override:
      a: ["qnan"]
      b: ["snan"]
    expected_c: "(np.nan)"

  case_25:
    description: "SNaN x normalized number"
    override:
      a: ["snan"]
      b: ["two"]
    expected_c: "(np.nan)"

  case_26:
    description: "SNaN x 0"
    override:
      a: ["snan"]
      b: ["zero"]
    expected_c: "(np.nan)"

  case_27:
    description: "SNaN x INF"
    override:
      a: ["snan"]
      b: ["inf"]
    expected_c: "(np.nan)"

  case_28:
    description: "SNaN x QNaN"
    override:
      a: ["snan"]
      b: ["qnan"]
    expected_c: "(np.nan)"

  case_29:
    description: "SNaN x SNaN"
    override:
      a: ["snan"]
      b: ["snan"]
    expected_c: "(np.nan)"

  case_30:
    description: "SNaN + normalized number"
    override:
      a: ["one"]
      b: ["two"]
      c: "snan"
    expected_c: "(np.nan)"

  case_31:
    description: "0 x 0"
    override:
      a: ["zero"]
      b: ["zero"]
    expected_c: "zero"

  case_32:
    description: "0 x -0"
    override:
      a: ["zero"]
      b: ["(-0.0)"]
    expected_c: "zero"

  case_33:
    description: "-0 + 0"
    override:
      a: ["one", "one"]
      b: ["(-0.0)", "zero"]
    expected_c: "zero"
  
  case_34:
    description: "INF x INF"
    override:
      a: ["inf"]
      b: ["(-np.inf)"]
    expected_c: "(-np.inf)"
  
  case_35:
    description: "INF + (-INF)"
    override:
      a: ["inf"]
      b: ["minusone"]
    expected_c: "(-np.inf)"