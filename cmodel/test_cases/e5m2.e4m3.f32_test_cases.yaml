# test_cases.yaml
defaults:  # 定义默认值
  a: ["zero", "zero", "zero", "zero"]
  b: ["zero", "zero", "zero", "zero"]
  c: "zero"
  expected_c: "zero"  # 默认的预期结果

test_cases:  # 测例定义
  case_1:
    description: "Test case with default values for a, b, and c"
    override: {}  # 不覆盖默认值
    expected_c: "zero"  # 预期的结果

  case_2:
    description: "Test input A/B subnormal support"
    override:
      a: ["minsubnormal"]
      b: ["four"]
    expected_c: "math.ldexp(1.0, -14)"  # 预期的结果
    expect: True

  case_3:
    description: "Test input C subnormal support math.ldexp(1.0, -139)"
    override:
      c: "math.ldexp(1.0, -139)"
    expected_c: "math.ldexp(1.0, -139)"  # 预期的结果
    expect: True
  
  case_3_1:
    description: "Test input C f32 subnormal doesn't support math.ldexp(1.0, -149)"
    override:
      c: "minsubnormal"
    expected_c: "minsubnormal"  # 预期的结果
    expect: False
  
  case_3_2:
    description: "Test input C support 13bit mantissa"
    override:
      c: "1+math.ldexp(1.0, -13)"
    expected_c: "1+math.ldexp(1.0, -13)"  # 预期的结果
    expect: True
  
  case_3_3:
    description: "Test input C support 14bit mantissa"
    override:
      c: "1+math.ldexp(1.0, -14)"
    expected_c: "1+math.ldexp(1.0, -14)"  # 预期的结果
    expect: False

  case_4:
    description: "Test input D support 13bit mantissa"
    override:
      a: ["math.ldexp(1.0, -7)"]
      b: ["math.ldexp(1.0, -6)"]
      c: "one"
    expected_c: "1 + math.ldexp(1.0,-13)"  # 预期的结果
    expect: True

  case_4_1:
    description: "Test input D support 14bit mantissa"
    override:
      a: ["math.ldexp(1.0, -7)"]
      b: ["math.ldexp(1.0, -7)"]
      c: "one"
    expected_c: "1 + math.ldexp(1.0,-14)"  # 预期的结果
    expect: True

  # case_5:
  #   description: "Test output D subnormal support"
  #   override:
  #     c: "minsubnormal"
  #   expected_c: "minsubnormal"  # 预期的结果
  #   expect: True

  case_5:
    description: "Test Accuracy of the dot products"
    override:
      a: ["aboveone"]
      b: ["aboveone"]
    expected_c: "1 + math.ldexp(1, -2) + math.ldexp(1, -3) + math.ldexp(1, -5)"  # 预期的结果
    expect: True

# —————————————————————— ROUNDING ——————————————————————
  case_7:
    description: "Test Rounding-to-Zero or Round-Down"
    override:
      a: ["one", "one"]
      b: ["one", "math.ldexp(1, -14) + math.ldexp(1, -15)"]
    expected_c: "one"
    expect: True

  case_7_1:
    description: "Test Rounding-to-Zero or Round-UP"
    override:
      a: ["one", "one"]
      b: ["minusone", "-math.ldexp(1, -14) - math.ldexp(1, -15)"]
    expected_c: "minusone"
    expect: True

  case_8:
    description: "Test \"Accumulator\" Rounding-to-Zero or Round-UP"
    override:
      a: ["one"]
      b: ["minusone"]
      c: "-math.ldexp(1, -14) - math.ldexp(1, -15)"
    expected_c: "minusone"
    expect: True

  case_8_1:
    description: "Test \"Accumulator\" Rounding-to-Zero or Round-Down"
    override:
      a: ["one"]
      b: ["one"]
      c: "math.ldexp(1.0, -14) + math.ldexp(1.0, -15) "
    expected_c: "one"
    expect: True
  
  case_9:
    description: "Bits in mantissa add: support 13bits"
    override:
      a: ["math.ldexp(1, -16)", "one"]
      b: ["one", "one"]
    expected_c: "1.0 + math.ldexp(1, -16)"
    expect: True
  
  case_9_1:
    description: "Test sticky bit in mantissa add: not supported"
    override:
      a: ["math.ldexp(1, -14)", "one", "one", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "one"]
      b: ["one", "one", "minusone", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
    expected_c: "1.0 + math.ldexp(1, -13)"
    expect: Fail

