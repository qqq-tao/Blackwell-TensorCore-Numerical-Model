    description: "Test extra bits for carry out, 5bits for FP8 K16"
    override:
      a: ["(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)","(1.75)", "(1.75)", "math.ldexp(1.0, -13)", "math.ldexp(1.0, -9)+math.ldexp(1.0, -10)+math.ldexp(1.0, -11)+math.ldexp(1.0, -12)+math.ldexp(1.0, -13)"]
      b: ["(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.0)", "(1.0)"]     
      c: "zero"
    expected_c: "36.75+math.ldexp(1.0, -8)"
    expect: True

