# test_cases.yaml
defaults:  # 定义默认值
  a: ["zero", "zero", "zero", "zero"]
  b: ["zero", "zero", "zero", "zero"]
  c: "zero"
  expected_c: "zero"  # 默认的预期结果

test_cases:  # 测例定义
  case_1:
    description: "Test case with default values for a, b, and c"
    override: {}  # 不覆盖默认值
    expected_c: "zero"  # 预期的结果

  case_2:
    description: "Test input A/B subnormal support"
    override:
      a: ["minsubnormal"]
      b: ["four"]
    expected_c: "math.ldexp(1.0,-22)"  # 预期的结果
    expect: True
  
  case_2_1:
    description: "Test input A support 10 bit mantissa"
    override:
      a: ["1.0 + math.ldexp(1.0,-10)"]
      b: ["one"]
    expected_c: "1.0 + math.ldexp(1.0,-10)"  # 预期的结果
    expect: True

  case_3:
    description: "Test input C subnormal support"
    override:
      c: "minsubnormal"
    expected_c: "minsubnormal"  # 预期的结果
    expect: True

  case_3_1:
    description: "Test input C support 10 bit mantissa"
    override:
      c: "1.0 + math.ldexp(1.0,-10)"
    expected_c: "1.0 + math.ldexp(1.0,-10)"  # 预期的结果
    expect: True

  case_4:
    description: "Test output D subnormal support"
    override:
      a: ["aboveone"]
      b: ["aboveone"]
      c: "- 1 - math.ldexp(1, -9)"
    expected_c: "math.ldexp(1, -20)"  # 预期的结果
    expect: True

  case_5:
    description: "Test Accuracy of the dot products: step add"
    override:
      a: ["aboveone"]
      b: ["aboveone"]
      c: "math.ldexp(1, -11) + math.ldexp(1, -12) + math.ldexp(1, -13) + math.ldexp(1, -14) + math.ldexp(1, -15) + math.ldexp(1, -16) + math.ldexp(1, -17) + math.ldexp(1, -18) + math.ldexp(1, -19) +  + math.ldexp(1, -20)"
    expected_c: "1 + math.ldexp(1, -9) + math.ldexp(1, -10)"  # 预期的结果
    expect: True

  case_5_1:
    description: "Test Accuracy of the dot products: C is minus one"
    override:
      a: ["1.0+math.ldexp(1.0, -10)", "zero", "zero", "zero", "zero", "zero", "zero", "zero", 
          "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      b: ["1.0-math.ldexp(1.0, -11)", "zero", "zero", "zero", "zero", "zero", "zero", "zero", 
          "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      c: "minusone"
    expected_c: "math.ldexp(1.0, -11)-math.ldexp(1.0, -21)"

  case_5_2:
    description: "Test Accuracy of belowone products"
    override:
      a: ["1 - math.ldexp(1.0, -11)", "one", "zero", "zero", "zero", "zero", "zero", "zero", 
          "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      b: ["1 - math.ldexp(1.0, -11)", "(-1.0)", "zero", "zero", "zero", "zero", "zero", "zero", 
          "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      c: "zero"
    expected_c: "-math.ldexp(1.0,-10) + math.ldexp(1.0, -22)"
    expect: True

# —————————————————————— Varifying Rounding in Dot Cell ——————————————————————
  case_6:
    description: "Test two submatrix behavior -- different submatrix"
    override:
      a: ["math.ldexp(1.0, -24)", "zero", "zero", "zero", "zero", "zero", "zero", "zero",
          "math.ldexp(1.0, -24)", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      b: ["math.ldexp(1.0, -1)", "zero", "zero", "zero", "zero", "zero", "zero", "zero", 
          "math.ldexp(1.0, -2)", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      c: "zero"
    expected_c: "math.ldexp(1.0, -24)"
    expect: False

  case_6_1: 
    description: "Test two submatrix behavior -- same submatrix"
    override:
      a: ["math.ldexp(1.0, -24)", "zero", "zero", "zero", "zero", "zero", "zero","math.ldexp(1.0, -24)",
          "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      b: ["math.ldexp(1.0, -1)", "zero", "zero", "zero", "zero", "zero", "zero", "math.ldexp(1.0, -2)",
          "zero", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      c: "zero"
    expected_c: "math.ldexp(1.0, -24)"
    expect: True

  # —————————————————————— ROUNDING ——————————————————————
  case_7:
    description: "Test Rounding-to-Zero or Round-Down"
    override:
      a: ["one", "one"]
      b: ["one", "math.ldexp(1, -11)+math.ldexp(1, -12)"]
    expected_c: "one"
    expect: False

  case_7_1:
    description: "Test Rounding-to-Zero or Round-UP"
    override:
      a: ["one", "one"]
      b: ["minusone", "-math.ldexp(1, -11) - math.ldexp(1, -12)"]
    expected_c: "minusone"
    expect: False

  case_7_2:
    description: "Test Rounding-to-Even"
    override:
      a: ["one"]
      b: ["one"]
      c: "math.ldexp(1, -11)+math.ldexp(1, -12)"
    expected_c: "1.0+math.ldexp(1, -10)"
    expect: True

  case_8:
    description: "Test \"Accumulator\" Rounding-to-Zero or Round-UP"
    override:
      a: ["one"]
      b: ["minusone"]
      c: "-math.ldexp(1, -11) - math.ldexp(1, -12)"
    expected_c: "minusone"
    expect: False

  case_8_1:
    description: "Test \"Accumulator\" Rounding-to-Zero or Round-Down"
    override:
      a: ["one"]
      b: ["one"]
      c: "math.ldexp(1.0, -11) + math.ldexp(1.0, -12) "
    expected_c: "one"
    expect: False
  
  case_8_2:
    description: "Test \"Accumulator\" Rounding-to-Even: test rounding strategy 1, rounding when LSB and Guard bit is 1."
    override:
      a: ["one"]
      b: ["one"]
      c: "math.ldexp(1.0, -11) + math.ldexp(1.0, -12) "
    expected_c: "1.0 + math.ldexp(1.0, -10)"
    expect: True

  case_8_3:
    description: "Test \"Accumulator\" Rounding-to-Even: test rounding strategy 2, LSB is Guard bit "
    override:
      a: ["one"]
      b: ["one"]
      c: "math.ldexp(1.0, -10) + math.ldexp(1.0, -11) "
    expected_c: "1.0 + math.ldexp(1.0, -10)"
    expect: True


  case_9:
    description: "One sticky bit in mantissa add: support 24bits"
    override:
      a: ["math.ldexp(1, -24)", "math.ldexp(1, -11)", "one"]
      b: ["one", "one", "one"]
      c: "zero"
    expected_c: "1 + math.ldexp(1, -10)"
    expect: True
  
  case_9_1:
    description: "One sticky bit in mantissa add: not support 25bits"
    override:
      a: ["math.ldexp(1, -24)", "math.ldexp(1, -11)", "one"]
      b: ["(0.5)", "one", "one"]
      c: "zero"
    expected_c: "1 + math.ldexp(1, -10)"
    expect: True
 
  case_10:
    description: "Test extra bits for carry out, 4bits for FP16 K8"
    override:
      a: ["(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "math.ldexp(1.0, -7)", "math.ldexp(1.0, -24)"]
      b: ["(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.75)", "(1.0)", "(1.0)"]     
      c: "zero"
    expected_c: "18+6*math.ldexp(1.0, -4)+math.ldexp(1.0, -6)"
    expect: True

  case_11:
    description: "Test exact bits in Accumulator"
    override:
      a: ["one"]
      b: ["one"]
      c: "math.ldexp(1.0, -11)+math.ldexp(1.0, -21)"
    expected_c: "1.0 + math.ldexp(1.0, -10)"
    expect: True
  
  case_12:
    description: "Test accumulate rank in Accumulator: (k8_0 + C) +k8_1"
    override:
      a: ["one", "zero", "zero", "zero", "zero", "zero", "zero", "zero", 
          "minusone", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      b: ["one", "zero", "zero", "zero", "zero", "zero", "zero", "zero", 
          "one", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      c: "math.ldexp(1.0, -11)+math.ldexp(1.0, -21)"
    expected_c: "math.ldexp(1.0, -10)"
    expect: True
  
  case_13:
    description: "Test the order of accumulation of dot products and C input: (C + dot_product_0) + dot_product_1"
    override:
      a: ["math.ldexp(1.0, 15)", "zero", "zero", "zero", "zero", "zero", "zero", "zero",
          "math.ldexp(1.0, 15)", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      b: ["minusone", "zero", "zero", "zero", "zero", "zero", "zero", "zero",
          "one", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      c: "math.ldexp(1.0, 15)"
    expected_c: "math.ldexp(1.0, 15)"

  case_14:
    description: "Test the order of accumulation of dot products and C input: (C + dot_product_0) + dot_product_1"
    override:
      a: ["math.ldexp(1.0, 15)", "zero", "zero", "zero", "zero", "zero", "zero", "zero",
          "math.ldexp(1.0, 15)", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      b: ["one", "zero", "zero", "zero", "zero", "zero", "zero", "zero",
          "minusone", "zero", "zero", "zero", "zero", "zero", "zero", "zero"]
      c: "math.ldexp(1.0, 15)"
    expected_c: "inf"

  case_16:
    description: "Test QNaN + positive normalized number"
    override:
      a: ['one', 'one']
      b: ['qnan', 'one']
    expected_c: "(np.nan)"

  case_17:
    description: "Test QNaN + negative normalized number"
    override:
      a: ['one', 'one']
      b: ['qnan', 'minusone']
    expected_c: "(np.nan)"

  case_18:
    description: "QNaN + INF"
    override:
      a: ["one", "one"]
      b: ["qnan", "inf"]
    expected_c: "(np.nan)"

  case_19:
    description: "QNaN + QNaN"
    override:
      a: ["one", "one"]
      b: ["qnan", "qnan"]
    expected_c: "(np.nan)"

  case_20:
    description: "QNaN x normalized number"
    override:
      a: ["qnan"]
      b: ["two"]
    expected_c: "(np.nan)"

  case_21:
    description: "QNaN x 0"
    override:
      a: ["qnan"]
      b: ["zero"]
    expected_c: "(np.nan)"

  case_22:  
    description: "QNaN x INF"
    override:
      a: ["qnan"]
      b: ["inf"]
    expected_c: "(np.nan)"

  case_23:
    description: "QNaN x QNaN"
    override:
      a: ["qnan"]
      b: ["qnan"]
    expected_c: "(np.nan)"

  case_24:
    description: "QNaN x SNaN"
    override:
      a: ["qnan"]
      b: ["snan"]
    expected_c: "(np.nan)"

  case_25:
    description: "SNaN x normalized number"
    override:
      a: ["snan"]
      b: ["two"]
    expected_c: "(np.nan)"

  case_26:
    description: "SNaN x 0"
    override:
      a: ["snan"]
      b: ["zero"]
    expected_c: "(np.nan)"

  case_27:
    description: "SNaN x INF"
    override:
      a: ["snan"]
      b: ["inf"]
    expected_c: "(np.nan)"

  case_28:
    description: "SNaN x QNaN"
    override:
      a: ["snan"]
      b: ["qnan"]
    expected_c: "(np.nan)"

  case_29:
    description: "SNaN x SNaN"
    override:
      a: ["snan"]
      b: ["snan"]
    expected_c: "(np.nan)"

  case_30:
    description: "SNaN + normalized number"
    override:
      a: ["one"]
      b: ["two"]
      c: "snan"
    expected_c: "(np.nan)"

  case_31:
    description: "0 x 0"
    override:
      a: ["zero"]
      b: ["zero"]
    expected_c: "zero"

  case_32:
    description: "0 x -0"
    override:
      a: ["zero"]
      b: ["(-0.0)"]
    expected_c: "zero"

  case_33:
    description: "-0 + 0"
    override:
     a: ["one", "one"]
     b: ["(-0.0)", "zero"]
    expected_c: "zero"
  
  case_34:
    description: "INF x INF"
    override:
      a: ["inf"]
      b: ["(-np.inf)"]
    expected_c: "(-np.inf)"
  
  case_35:
    description: "INF + (-INF)"
    override:
      a: ["inf"]
      b: ["minusone"]
    expected_c: "(-np.inf)"

  case_36:
    description: "INF + (-INF)"
    override:
      a: ["inf", "inf"]
      b: ["minusone", "one"]
    expected_c: "(-np.inf)"

  case_37:
    description: "minnormal x minnormal"
    override:
      a: ["minsubnormal"]
      b: ["math.ldexp(-1, -10)"]
      